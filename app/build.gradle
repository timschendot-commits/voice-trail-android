plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.voicetrail'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.voicetrail'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(rootProject.file('core/licenses'))
}

// An APK without the embedded core would fail only when the user starts a task.
// Fail at packaging time with a reproducible build instruction.
def checkNativeCore = tasks.register('checkNativeCore') {
    doLast {
        ['arm64-v8a', 'x86_64'].each { abi ->
            File library = project.file("src/main/jniLibs/${abi}/libvoicetrail.so")
            if (!library.isFile() || library.length() == 0) {
                throw new GradleException("Missing ${library}. Set ANDROID_NDK_HOME and run bash core/build-android.sh from the repository root.")
            }
        }
    }
}

tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('NativeLibs')) {
        dependsOn(checkNativeCore)
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

name: Published APK on a clean Android device
on:
  push:
    branches: [test/published-apk-emulator]
    paths:
      - '.github/workflows/published-apk-smoke.yml'
      - 'tools/emulator-*'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public APK
        run: |
          set -euo pipefail
          dir=release
          mkdir -p "$dir" evidence
          url="https://github.com/timschendot-commits/voice-trail-android/releases/download/preview-077bf18f8c56"
          curl --fail --silent --show-error --location "$url/VoiceTrail-debug.apk" -o "$dir/VoiceTrail-debug.apk"
          curl --fail --silent --show-error --location "$url/SHA256SUMS" -o "$dir/SHA256SUMS"
          (cd "$dir" && echo '86903beab824688b4a1c0f4d7ad1a98be529e202b9031d0e911edbd78712ddb0  VoiceTrail-debug.apk' | sha256sum -c - && sha256sum -c SHA256SUMS)
          if ! /usr/bin/python3 -c 'from PIL import Image' 2>/dev/null || [[ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-pil fonts-dejavu-core fonts-noto-cjk
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the published app on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front none
          script: bash tools/emulator-suite.sh
      - name: Collect device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-apk-device-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
